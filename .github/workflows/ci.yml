name: lint + unit tests

# Every job runs on the project's own runner (.devcontainer); there are no
# hosted-runner minutes for this private repo. The job runs the whole suite
# (unit, integration, real-file, journey) once per change and keeps its JUnit
# report as an artifact: plan statuses are recorded from it (plan_status.py),
# so no separate local run is needed. Pushes touching only the plan, gates,
# reviews or docs skip it; no test reads those paths.

on:
  push:
    branches: [main]
    paths-ignore: ["testing/**", "docs/**"]
  pull_request:
    paths-ignore: ["testing/**", "docs/**"]

permissions:
  contents: read

concurrency:
  group: bench             # one job at a time on the runner next to the bench
  cancel-in-progress: false

jobs:
  check:
    runs-on: [self-hosted, testbench]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fresh venv with unblob 26.6.4 and the pinned dev tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -e '.[dev]'
          .venv/bin/python -c "import importlib.metadata as m; print('unblob', m.version('unblob'))"

      - name: ruff (unblob's configuration, FSD C-05)
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: pyright (unblob's configuration, FSD C-05)
        env:
          PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"
        run: .venv/bin/pyright --pythonpath .venv/bin/python

      - name: Test suite (all tiers)
        run: .venv/bin/pytest -q --junitxml=test-results/ci.xml

      - name: Keep the JUnit report for plan_status.py
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ github.sha }}
          path: test-results/ci.xml
          retention-days: 90
