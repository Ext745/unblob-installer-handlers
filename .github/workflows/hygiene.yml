name: Hygiene

# Secret and personal-data scans only. Lint and tests stay on the project's own
# runner in ci.yml. See docs/decisions/0004-hosted-hygiene-ci.md.
on:
  push:
    branches: [main, master]   # PR commits are covered by pull_request, so they don't run twice
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history, so gitleaks scans every commit

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Secrets in full history (gitleaks)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --log-opts="--all" --redact --no-banner .

      - name: Personal data scan
        run: make scrub-check

      - name: Scrubber self-test
        run: python3 tools/scrub.py --self-test
