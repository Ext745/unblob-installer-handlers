name: release

# On a version tag: build -> verify (the journey on THIS run's wheel) ->
# release. A red or not-done journey publishes nothing: a skipped step (the
# real-file store missing, say) fails verify too. workflow_dispatch runs build
# and verify only, as the dry run of the release path.
# REALFILES_DIR is the devcontainer's read-only mount of the real files
# (testing/test-plan.yaml capability realfiles-store).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write          # the release job creates the release

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, testbench]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: The tag equals the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want=${GITHUB_REF#refs/tags/v}
          have=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/unblob_installers/__about__.py)
          echo "tag $want, package $have"
          [ "$want" = "$have" ]

      - name: Build wheel and sdist
        run: |
          python3 -m venv .build-venv
          .build-venv/bin/pip install -q 'build==1.3.0'
          .build-venv/bin/python -m build --outdir dist .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  verify:
    needs: build
    runs-on: [self-hosted, testbench]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: The journey on the released wheel
        run: |
          python3 -m venv .verify-venv
          .verify-venv/bin/pip install -q dist/*.whl 'pytest==8.4.2'
          # The package under test is the wheel, not the checkout's src/.
          .verify-venv/bin/python -c "import unblob_installers as u; print(u.__file__); assert '/.verify-venv/' in u.__file__"
          .verify-venv/bin/pytest tests/journey -m journey --realfiles "$REALFILES_DIR" --junitxml=journey.xml
          # Every journey step ran and passed: none skipped, none missing.
          .verify-venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("journey.xml").getroot()
          suite = root if root.tag == "testsuite" else root[0]
          counts = {k: int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
          print(counts)
          assert counts["tests"] >= 6 and counts["failures"] + counts["errors"] + counts["skipped"] == 0
          PY

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: [self-hosted, testbench]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
